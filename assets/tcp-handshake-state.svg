<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="tcpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090d" />
      <stop offset="100%" stop-color="#0c1520" />
    </linearGradient>
    <pattern id="tcpGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#132333" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes synFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    .syn-anim { stroke-dasharray: 8 8; animation: synFlow 1.5s linear infinite; }
  </style>

  <rect width="1200" height="680" fill="url(#tcpBgGrad)" rx="12" stroke="#1d3347" stroke-width="2"/>
  <rect width="1200" height="680" fill="url(#tcpGrid)" rx="12"/>

  <!-- Title -->
  <g transform="translate(40, 42)">
    <text fill="#10b981" class="font-mono" font-size="15" font-weight="800" letter-spacing="2">[ RFC 793 / RFC 9293 PROTOCOL DYNAMICS ]</text>
    <text y="30" fill="#ffffff" class="font-mono" font-size="26" font-weight="900">TCP 3-WAY HANDSHAKE &amp; STATE MACHINE</text>
  </g>

  <!-- Left: Sequence Timing Diagram -->
  <g transform="translate(40, 95)">
    <rect width="660" height="555" rx="10" fill="#08121a" stroke="#1c3347" stroke-width="1.8"/>
    
    <!-- Client & Server Headers -->
    <g transform="translate(40, 20)">
      <rect x="20" width="160" height="42" rx="6" fill="#0e2333" stroke="#0284c7" stroke-width="1.8"/>
      <text x="100" y="27" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="15" font-weight="900">CLIENT (HOST A)</text>
      
      <rect x="400" width="160" height="42" rx="6" fill="#0e2333" stroke="#10b981" stroke-width="1.8"/>
      <text x="480" y="27" text-anchor="middle" fill="#34d399" class="font-mono" font-size="15" font-weight="900">SERVER (HOST B)</text>

      <!-- Lifelines -->
      <line x1="100" y1="42" x2="100" y2="510" stroke="#253f56" stroke-width="3" stroke-dasharray="6 6"/>
      <line x1="480" y1="42" x2="480" y2="510" stroke="#253f56" stroke-width="3" stroke-dasharray="6 6"/>

      <!-- SECTION 1: 3-WAY HANDSHAKE -->
      <text x="290" y="65" text-anchor="middle" fill="#f59e0b" class="font-mono" font-size="14" font-weight="900">--- PHASE 1: 3-WAY HANDSHAKE ---</text>

      <!-- Step 1: SYN -->
      <g transform="translate(0, 90)">
        <line x1="100" y1="0" x2="480" y2="40" stroke="#38bdf8" stroke-width="3.5" class="syn-anim"/>
        <polygon points="480,40 466,32 470,44" fill="#38bdf8"/>
        <rect x="150" y="4" width="280" height="28" rx="4" fill="#08141f" stroke="#0284c7" stroke-width="1.2"/>
        <text x="290" y="23" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="13.5" font-weight="800">1. SYN [Seq=ISN_c, Win=65K, MSS=1460]</text>
      </g>

      <!-- Step 2: SYN-ACK -->
      <g transform="translate(0, 150)">
        <line x1="480" y1="0" x2="100" y2="40" stroke="#10b981" stroke-width="3.5" class="syn-anim"/>
        <polygon points="100,40 114,32 110,44" fill="#10b981"/>
        <rect x="140" y="4" width="300" height="28" rx="4" fill="#081615" stroke="#059669" stroke-width="1.2"/>
        <text x="290" y="23" text-anchor="middle" fill="#34d399" class="font-mono" font-size="13.5" font-weight="800">2. SYN+ACK [Seq=ISN_s, Ack=ISN_c+1]</text>
      </g>

      <!-- Step 3: ACK -->
      <g transform="translate(0, 210)">
        <line x1="100" y1="0" x2="480" y2="40" stroke="#f59e0b" stroke-width="3.5" class="syn-anim"/>
        <polygon points="480,40 466,32 470,44" fill="#f59e0b"/>
        <rect x="160" y="4" width="260" height="28" rx="4" fill="#161208" stroke="#d97706" stroke-width="1.2"/>
        <text x="290" y="23" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="13.5" font-weight="800">3. ACK [Seq=ISN_c+1, Ack=ISN_s+1]</text>
      </g>

      <!-- ESTABLISHED STATE -->
      <g transform="translate(0, 270)">
        <rect x="20" width="160" height="28" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
        <text x="100" y="19" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="13" font-weight="900">ESTABLISHED</text>

        <rect x="400" width="160" height="28" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
        <text x="480" y="19" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="13" font-weight="900">ESTABLISHED</text>
      </g>

      <!-- SECTION 2: 4-WAY TEARDOWN -->
      <text x="290" y="325" text-anchor="middle" fill="#ef4444" class="font-mono" font-size="14" font-weight="900">--- PHASE 2: 4-WAY GRACEFUL TEARDOWN ---</text>

      <!-- Step 4: FIN -->
      <g transform="translate(0, 345)">
        <line x1="100" y1="0" x2="480" y2="35" stroke="#ef4444" stroke-width="3"/>
        <polygon points="480,35 466,28 470,39" fill="#ef4444"/>
        <rect x="180" y="2" width="220" height="26" rx="4" fill="#1c0c0e" stroke="#ef4444" stroke-width="1"/>
        <text x="290" y="20" text-anchor="middle" fill="#fca5a5" class="font-mono" font-size="13" font-weight="800">1. FIN [Seq=u, Ack=v]</text>
      </g>

      <!-- Step 5: ACK -->
      <g transform="translate(0, 395)">
        <line x1="480" y1="0" x2="100" y2="35" stroke="#94a3b8" stroke-width="3"/>
        <polygon points="100,35 114,28 110,39" fill="#94a3b8"/>
        <rect x="180" y="2" width="220" height="26" rx="4" fill="#111827" stroke="#64748b" stroke-width="1"/>
        <text x="290" y="20" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="13" font-weight="800">2. ACK [Seq=v, Ack=u+1]</text>
      </g>

      <!-- Step 6: FIN -->
      <g transform="translate(0, 445)">
        <line x1="480" y1="0" x2="100" y2="35" stroke="#ef4444" stroke-width="3"/>
        <polygon points="100,35 114,28 110,39" fill="#ef4444"/>
        <rect x="180" y="2" width="220" height="26" rx="4" fill="#1c0c0e" stroke="#ef4444" stroke-width="1"/>
        <text x="290" y="20" text-anchor="middle" fill="#fca5a5" class="font-mono" font-size="13" font-weight="800">3. FIN [Seq=w, Ack=u+1]</text>
      </g>

      <!-- Step 7: ACK -->
      <g transform="translate(0, 495)">
        <line x1="100" y1="0" x2="480" y2="35" stroke="#94a3b8" stroke-width="3"/>
        <polygon points="480,35 466,28 470,39" fill="#94a3b8"/>
        <rect x="180" y="2" width="220" height="26" rx="4" fill="#111827" stroke="#64748b" stroke-width="1"/>
        <text x="290" y="20" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="13" font-weight="800">4. ACK [Seq=u+1, Ack=w+1]</text>
      </g>
    </g>
  </g>

  <!-- Right: TCP State Machine Transition Summary (Enlarged) -->
  <g transform="translate(720, 95)">
    <rect width="440" height="555" rx="10" fill="#08121a" stroke="#1c3347" stroke-width="1.8"/>
    <text x="220" y="32" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="16" font-weight="900">TCP STATE MACHINE (FSM)</text>

    <!-- State Boxes -->
    <g transform="translate(20, 52)">
      <!-- CLOSED -->
      <rect width="400" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="16" y="27" fill="#94a3b8" class="font-mono" font-size="15" font-weight="900">CLOSED</text>
      <text x="120" y="27" fill="#64748b" class="font-mono" font-size="13">Initial / Idle socket state</text>

      <!-- LISTEN -->
      <g transform="translate(0, 52)">
        <rect width="400" height="42" rx="6" fill="#0c2033" stroke="#0284c7" stroke-width="1.5"/>
        <text x="16" y="27" fill="#38bdf8" class="font-mono" font-size="15" font-weight="900">LISTEN</text>
        <text x="120" y="27" fill="#94a3b8" class="font-mono" font-size="13">Server awaiting incoming SYN</text>
      </g>

      <!-- SYN-SENT / SYN-RCVD -->
      <g transform="translate(0, 104)">
        <rect width="195" height="42" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="12" y="27" fill="#93c5fd" class="font-mono" font-size="14" font-weight="900">SYN_SENT</text>

        <rect x="205" width="195" height="42" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="217" y="27" fill="#93c5fd" class="font-mono" font-size="14" font-weight="900">SYN_RCVD</text>
      </g>

      <!-- ESTABLISHED -->
      <g transform="translate(0, 156)">
        <rect width="400" height="46" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
        <circle cx="22" cy="23" r="6" fill="#34d399"/>
        <text x="38" y="29" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">ESTABLISHED</text>
        <text x="180" y="29" fill="#a7f3d0" class="font-mono" font-size="13">Bidirectional byte stream</text>
      </g>

      <!-- Teardown States -->
      <g transform="translate(0, 212)">
        <rect width="195" height="42" rx="6" fill="#24142b" stroke="#a855f7" stroke-width="1.5"/>
        <text x="12" y="27" fill="#d8b4fe" class="font-mono" font-size="14" font-weight="900">FIN_WAIT_1</text>

        <rect x="205" width="195" height="42" rx="6" fill="#24142b" stroke="#a855f7" stroke-width="1.5"/>
        <text x="217" y="27" fill="#d8b4fe" class="font-mono" font-size="14" font-weight="900">CLOSE_WAIT</text>
      </g>

      <g transform="translate(0, 264)">
        <rect width="195" height="42" rx="6" fill="#24142b" stroke="#a855f7" stroke-width="1.5"/>
        <text x="12" y="27" fill="#d8b4fe" class="font-mono" font-size="14" font-weight="900">FIN_WAIT_2</text>

        <rect x="205" width="195" height="42" rx="6" fill="#24142b" stroke="#a855f7" stroke-width="1.5"/>
        <text x="217" y="27" fill="#d8b4fe" class="font-mono" font-size="14" font-weight="900">LAST_ACK</text>
      </g>

      <!-- TIME_WAIT -->
      <g transform="translate(0, 316)">
        <rect width="400" height="46" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.8"/>
        <text x="16" y="29" fill="#fbbf24" class="font-mono" font-size="15" font-weight="900">TIME_WAIT (2 * MSL = 60-120s)</text>
      </g>

      <!-- Congestion Control Info -->
      <g transform="translate(0, 372)">
        <rect width="400" height="115" rx="6" fill="#09141f" stroke="#1f3448" stroke-width="1.5"/>
        <text x="16" y="26" fill="#38bdf8" class="font-mono" font-size="13.5" font-weight="800">CONGESTION CONTROL ALGORITHMS:</text>
        <text x="16" y="52" fill="#cbd5e1" class="font-mono" font-size="13">· <tspan fill="#34d399" font-weight="800">TCP BBR</tspan> (Bandwidth &amp; RTT model)</text>
        <text x="16" y="76" fill="#cbd5e1" class="font-mono" font-size="13">· <tspan fill="#38bdf8" font-weight="800">TCP CUBIC</tspan> (Cubic growth curve)</text>
        <text x="16" y="100" fill="#cbd5e1" class="font-mono" font-size="13">· <tspan fill="#f59e0b" font-weight="800">TCP RENO</tspan> (Standard AIMD)</text>
      </g>
    </g>
  </g>
</svg>
