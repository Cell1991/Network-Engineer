<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tcpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="100%" stop-color="#0f1622" />
    </linearGradient>
    <pattern id="tcpGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#13202c" stroke-width="0.6"/>
    </pattern>
    <filter id="tcpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes synFlow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .syn-anim { stroke-dasharray: 6 6; animation: synFlow 1.5s linear infinite; }
  </style>

  <rect width="1200" height="600" fill="url(#tcpBgGrad)" rx="10" stroke="#1e2e3d" stroke-width="1.5"/>
  <rect width="1200" height="600" fill="url(#tcpGrid)" rx="10"/>

  <!-- Title -->
  <g transform="translate(40, 36)">
    <text fill="#10b981" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.5">[ RFC 793 / RFC 9293 // CONNECTION DYNAMICS ]</text>
    <text y="24" fill="#ffffff" class="font-mono" font-size="20" font-weight="900">TCP 3-WAY HANDSHAKE, 4-WAY TEARDOWN &amp; STATE MACHINE</text>
  </g>

  <!-- Left: Handshake Timing Sequence Diagram -->
  <g transform="translate(40, 80)">
    <rect width="660" height="490" rx="8" fill="#091118" stroke="#172b3c" stroke-width="1.2"/>
    
    <!-- Client & Server Lifelines -->
    <g transform="translate(50, 20)">
      <!-- Client Header -->
      <rect x="30" width="140" height="34" rx="4" fill="#0e2333" stroke="#0284c7" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="12" font-weight="800">CLIENT (HOST A)</text>
      
      <!-- Server Header -->
      <rect x="390" width="140" height="34" rx="4" fill="#0e2333" stroke="#10b981" stroke-width="1.2"/>
      <text x="460" y="22" text-anchor="middle" fill="#34d399" class="font-mono" font-size="12" font-weight="800">SERVER (HOST B)</text>

      <!-- Vertical Lifelines -->
      <line x1="100" y1="34" x2="100" y2="440" stroke="#233a4e" stroke-width="2" stroke-dasharray="4 4"/>
      <line x1="460" y1="34" x2="460" y2="440" stroke="#233a4e" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- SECTION 1: 3-WAY HANDSHAKE -->
      <text x="280" y="55" text-anchor="middle" fill="#f59e0b" class="font-mono" font-size="11" font-weight="800">--- PHASE 1: 3-WAY HANDSHAKE ---</text>

      <!-- Step 1: SYN (Client -> Server) -->
      <g transform="translate(0, 75)">
        <rect x="0" y="-8" width="80" height="20" rx="3" fill="#1e293b"/>
        <text x="40" y="6" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="9">SYN_SENT</text>

        <line x1="100" y1="0" x2="460" y2="35" stroke="#38bdf8" stroke-width="2.5" class="syn-anim"/>
        <polygon points="460,35 450,28 452,38" fill="#38bdf8"/>
        
        <rect x="160" y="2" width="240" height="22" rx="3" fill="#08141f" stroke="#0284c7" stroke-width="0.8"/>
        <text x="280" y="16" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="9.5" font-weight="700">1. SYN [Seq=ISN_c, Win=65535, MSS=1460]</text>
      </g>

      <!-- Step 2: SYN-ACK (Server -> Client) -->
      <g transform="translate(0, 125)">
        <rect x="480" y="-8" width="80" height="20" rx="3" fill="#1e293b"/>
        <text x="520" y="6" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="9">SYN_RCVD</text>

        <line x1="460" y1="0" x2="100" y2="35" stroke="#10b981" stroke-width="2.5" class="syn-anim"/>
        <polygon points="100,35 110,28 108,38" fill="#10b981"/>
        
        <rect x="150" y="2" width="260" height="22" rx="3" fill="#081615" stroke="#059669" stroke-width="0.8"/>
        <text x="280" y="16" text-anchor="middle" fill="#34d399" class="font-mono" font-size="9.5" font-weight="700">2. SYN+ACK [Seq=ISN_s, Ack=ISN_c+1, MSS=1460]</text>
      </g>

      <!-- Step 3: ACK (Client -> Server) -->
      <g transform="translate(0, 175)">
        <line x1="100" y1="0" x2="460" y2="35" stroke="#f59e0b" stroke-width="2.5" class="syn-anim"/>
        <polygon points="460,35 450,28 452,38" fill="#f59e0b"/>
        
        <rect x="170" y="2" width="220" height="22" rx="3" fill="#161208" stroke="#d97706" stroke-width="0.8"/>
        <text x="280" y="16" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="9.5" font-weight="700">3. ACK [Seq=ISN_c+1, Ack=ISN_s+1]</text>
      </g>

      <!-- ESTABLISHED STATE -->
      <g transform="translate(0, 222)">
        <rect x="10" width="100" height="22" rx="4" fill="#059669"/>
        <text x="60" y="15" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="9.5" font-weight="900">ESTABLISHED</text>

        <rect x="450" width="100" height="22" rx="4" fill="#059669"/>
        <text x="500" y="15" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="9.5" font-weight="900">ESTABLISHED</text>
      </g>

      <!-- SECTION 2: 4-WAY CONNECTION TEARDOWN -->
      <text x="280" y="270" text-anchor="middle" fill="#ef4444" class="font-mono" font-size="11" font-weight="800">--- PHASE 2: 4-WAY GRACEFUL TEARDOWN ---</text>

      <!-- Step 4: FIN (Client -> Server) -->
      <g transform="translate(0, 290)">
        <line x1="100" y1="0" x2="460" y2="30" stroke="#ef4444" stroke-width="2"/>
        <polygon points="460,30 450,24 452,34" fill="#ef4444"/>
        <rect x="180" y="0" width="200" height="20" rx="3" fill="#180b0b" stroke="#ef4444" stroke-width="0.8"/>
        <text x="280" y="14" text-anchor="middle" fill="#fca5a5" class="font-mono" font-size="9.5" font-weight="700">1. FIN [Seq=u, Ack=v]</text>
      </g>

      <!-- Step 5: ACK (Server -> Client) -->
      <g transform="translate(0, 330)">
        <line x1="460" y1="0" x2="100" y2="30" stroke="#94a3b8" stroke-width="2"/>
        <polygon points="100,30 110,24 108,34" fill="#94a3b8"/>
        <rect x="180" y="0" width="200" height="20" rx="3" fill="#111827" stroke="#64748b" stroke-width="0.8"/>
        <text x="280" y="14" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="9.5" font-weight="700">2. ACK [Seq=v, Ack=u+1]</text>
      </g>

      <!-- Step 6: FIN (Server -> Client) -->
      <g transform="translate(0, 370)">
        <line x1="460" y1="0" x2="100" y2="30" stroke="#ef4444" stroke-width="2"/>
        <polygon points="100,30 110,24 108,34" fill="#ef4444"/>
        <rect x="180" y="0" width="200" height="20" rx="3" fill="#180b0b" stroke="#ef4444" stroke-width="0.8"/>
        <text x="280" y="14" text-anchor="middle" fill="#fca5a5" class="font-mono" font-size="9.5" font-weight="700">3. FIN [Seq=w, Ack=u+1]</text>
      </g>

      <!-- Step 7: ACK (Client -> Server) -->
      <g transform="translate(0, 410)">
        <line x1="100" y1="0" x2="460" y2="30" stroke="#94a3b8" stroke-width="2"/>
        <polygon points="460,30 450,24 452,34" fill="#94a3b8"/>
        <rect x="180" y="0" width="200" height="20" rx="3" fill="#111827" stroke="#64748b" stroke-width="0.8"/>
        <text x="280" y="14" text-anchor="middle" fill="#cbd5e1" class="font-mono" font-size="9.5" font-weight="700">4. ACK [Seq=u+1, Ack=w+1]</text>
      </g>
    </g>
  </g>

  <!-- Right: TCP State Machine Transition Summary -->
  <g transform="translate(720, 80)">
    <rect width="440" height="490" rx="8" fill="#091118" stroke="#172b3c" stroke-width="1.2"/>
    <text x="220" y="28" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="12" font-weight="800">TCP FINITE STATE MACHINE (FSM)</text>

    <!-- State Boxes -->
    <g transform="translate(20, 45)">
      <!-- CLOSED -->
      <rect width="400" height="34" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" class="font-mono" font-size="11" font-weight="800">CLOSED</text>
      <text x="120" y="22" fill="#64748b" class="font-mono" font-size="10">Initial / Passive idle socket state</text>

      <!-- LISTEN -->
      <g transform="translate(0, 42)">
        <rect width="400" height="34" rx="4" fill="#0d1f2d" stroke="#0284c7" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" class="font-mono" font-size="11" font-weight="800">LISTEN</text>
        <text x="120" y="22" fill="#94a3b8" class="font-mono" font-size="10">Server awaiting incoming connection</text>
      </g>

      <!-- SYN-SENT / SYN-RCVD -->
      <g transform="translate(0, 84)">
        <rect width="195" height="34" rx="4" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
        <text x="10" y="22" fill="#93c5fd" class="font-mono" font-size="10.5" font-weight="800">SYN_SENT</text>
        <text x="100" y="22" fill="#60a5fa" class="font-mono" font-size="9">Client active</text>

        <rect x="205" width="195" height="34" rx="4" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
        <text x="215" y="22" fill="#93c5fd" class="font-mono" font-size="10.5" font-weight="800">SYN_RCVD</text>
        <text x="310" y="22" fill="#60a5fa" class="font-mono" font-size="9">Server acked</text>
      </g>

      <!-- ESTABLISHED -->
      <g transform="translate(0, 126)">
        <rect width="400" height="40" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="4" fill="#34d399"/>
        <text x="34" y="25" fill="#ffffff" class="font-mono" font-size="12" font-weight="900">ESTABLISHED</text>
        <text x="150" y="25" fill="#a7f3d0" class="font-mono" font-size="10">Bidirectional reliable data stream</text>
      </g>

      <!-- Teardown States -->
      <g transform="translate(0, 174)">
        <rect width="195" height="34" rx="4" fill="#1f1523" stroke="#a855f7" stroke-width="1"/>
        <text x="10" y="22" fill="#d8b4fe" class="font-mono" font-size="10" font-weight="800">FIN_WAIT_1</text>
        <text x="105" y="22" fill="#c084fc" class="font-mono" font-size="9">Sent 1st FIN</text>

        <rect x="205" width="195" height="34" rx="4" fill="#1f1523" stroke="#a855f7" stroke-width="1"/>
        <text x="215" y="22" fill="#d8b4fe" class="font-mono" font-size="10" font-weight="800">CLOSE_WAIT</text>
        <text x="315" y="22" fill="#c084fc" class="font-mono" font-size="9">Got remote FIN</text>
      </g>

      <g transform="translate(0, 216)">
        <rect width="195" height="34" rx="4" fill="#1f1523" stroke="#a855f7" stroke-width="1"/>
        <text x="10" y="22" fill="#d8b4fe" class="font-mono" font-size="10" font-weight="800">FIN_WAIT_2</text>
        <text x="105" y="22" fill="#c084fc" class="font-mono" font-size="9">Got ACK for FIN</text>

        <rect x="205" width="195" height="34" rx="4" fill="#1f1523" stroke="#a855f7" stroke-width="1"/>
        <text x="215" y="22" fill="#d8b4fe" class="font-mono" font-size="10" font-weight="800">LAST_ACK</text>
        <text x="305" y="22" fill="#c084fc" class="font-mono" font-size="9">Awaiting final ACK</text>
      </g>

      <!-- TIME_WAIT -->
      <g transform="translate(0, 258)">
        <rect width="400" height="38" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="14" y="24" fill="#fbbf24" class="font-mono" font-size="11" font-weight="800">TIME_WAIT (2 * MSL = 60-120s)</text>
        <text x="235" y="24" fill="#fed7aa" class="font-mono" font-size="9.5">Prevents delayed packet ghosting</text>
      </g>

      <!-- TCP Congestion Control Summary -->
      <g transform="translate(0, 310)">
        <rect width="400" height="110" rx="4" fill="#080e15" stroke="#1f2d3d" stroke-width="1"/>
        <text x="12" y="22" fill="#38bdf8" class="font-mono" font-size="10.5" font-weight="800">CONGESTION CONTROL ALGORITHMS:</text>
        <text x="12" y="44" fill="#cbd5e1" class="font-mono" font-size="9.5">1. <tspan fill="#34d399" font-weight="700">TCP BBR</tspan> (Bottleneck Bandwidth &amp; RTT model)</text>
        <text x="12" y="64" fill="#cbd5e1" class="font-mono" font-size="9.5">2. <tspan fill="#38bdf8" font-weight="700">TCP CUBIC</tspan> (Cubic window growth function)</text>
        <text x="12" y="84" fill="#cbd5e1" class="font-mono" font-size="9.5">3. <tspan fill="#f59e0b" font-weight="700">TCP RENO</tspan> (AIMD: Additive Increase Multiplicative Dec)</text>
        <text x="12" y="102" fill="#cbd5e1" class="font-mono" font-size="9.5">4. <tspan fill="#a855f7" font-weight="700">TCP SACK</tspan> (Selective Acknowledgement RFC 2018)</text>
      </g>
    </g>
  </g>
</svg>
