<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090d"/>
      <stop offset="100%" stop-color="#0c141d"/>
    </linearGradient>
    <pattern id="bentoGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#13202c" stroke-width="0.5"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="620" fill="url(#bentoBgGrad)" rx="10" stroke="#1e2e3d" stroke-width="1.5"/>
  <rect width="1200" height="620" fill="url(#bentoGridPattern)" rx="10"/>

  <!-- Bento Grid Cards (3 cols x 2 rows) -->
  <g transform="translate(40, 40)">
    <!-- Card 1: Subnetting & CIDR Math Engine -->
    <g transform="translate(0, 0)">
      <rect width="360" height="250" rx="8" fill="#09131c" stroke="#10b981" stroke-width="1.2"/>
      <rect x="20" y="20" width="34" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="37" y="42" text-anchor="middle" fill="#34d399" class="font-mono" font-size="14" font-weight="900">[#1]</text>
      
      <text x="64" y="36" fill="#10b981" class="font-mono" font-size="11" font-weight="700">CORE MODULE</text>
      <text x="64" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">VLSM &amp; CIDR CALCULATOR</text>
      
      <text x="20" y="85" fill="#cbd5e1" class="font-sans" font-size="12">Bitwise IPv4/IPv6 address arithmetic engine:</text>
      <text x="20" y="105" fill="#94a3b8" class="font-mono" font-size="10.5">· Optimal VLSM binary subnet partitioner</text>
      <text x="20" y="125" fill="#94a3b8" class="font-mono" font-size="10.5">· Supernetting / CIDR aggregation logic</text>
      <text x="20" y="145" fill="#94a3b8" class="font-mono" font-size="10.5">· IPv6 EUI-64 &amp; SLAAC generator</text>
      
      <rect x="20" y="175" width="320" height="55" rx="4" fill="#050a0f" stroke="#182c3c" stroke-width="1"/>
      <text x="30" y="196" fill="#34d399" class="font-mono" font-size="10">&gt; python -m src.cli vlsm 10.0.0.0/24 50,30,10</text>
      <text x="30" y="216" fill="#64748b" class="font-mono" font-size="10">Allocated: 3 subnets without fragmentation</text>
    </g>

    <!-- Card 2: Routing Protocols & Algorithms -->
    <g transform="translate(380, 0)">
      <rect width="360" height="250" rx="8" fill="#09131c" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="20" y="20" width="34" height="34" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="37" y="42" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="14" font-weight="900">[#2]</text>
      
      <text x="64" y="36" fill="#f59e0b" class="font-mono" font-size="11" font-weight="700">ROUTING ENGINES</text>
      <text x="64" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">DIJKSTRA SPF &amp; BGP-4</text>
      
      <text x="20" y="85" fill="#cbd5e1" class="font-sans" font-size="12">Graph-theoretic routing algorithmic core:</text>
      <text x="20" y="105" fill="#94a3b8" class="font-mono" font-size="10.5">· Dijkstra OSPF SPF Shortest Path Tree</text>
      <text x="20" y="125" fill="#94a3b8" class="font-mono" font-size="10.5">· BGP 10-step Best Path Selection engine</text>
      <text x="20" y="145" fill="#94a3b8" class="font-mono" font-size="10.5">· Bellman-Ford Distance Vector simulator</text>
      
      <rect x="20" y="175" width="320" height="55" rx="4" fill="#050a0f" stroke="#182c3c" stroke-width="1"/>
      <text x="30" y="196" fill="#fbbf24" class="font-mono" font-size="10">&gt; python -m src.cli route-spf topology.json</text>
      <text x="30" y="216" fill="#64748b" class="font-mono" font-size="10">Computed SPF Tree: Root R1 in 0.42ms</text>
    </g>

    <!-- Card 3: IEEE 802 Switching & STP -->
    <g transform="translate(760, 0)">
      <rect width="360" height="250" rx="8" fill="#09131c" stroke="#06b6d4" stroke-width="1.2"/>
      <rect x="20" y="20" width="34" height="34" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="37" y="42" text-anchor="middle" fill="#67e8f9" class="font-mono" font-size="14" font-weight="900">[#3]</text>
      
      <text x="64" y="36" fill="#06b6d4" class="font-mono" font-size="11" font-weight="700">L2 LAYER</text>
      <text x="64" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">STP &amp; MAC TABLE SIMULATOR</text>
      
      <text x="20" y="85" fill="#cbd5e1" class="font-sans" font-size="12">Switching fabric &amp; loop prevention:</text>
      <text x="20" y="105" fill="#94a3b8" class="font-mono" font-size="10.5">· IEEE 802.1D BPDU bridge root election</text>
      <text x="20" y="125" fill="#94a3b8" class="font-mono" font-size="10.5">· Root/Designated/Blocking port roles</text>
      <text x="20" y="145" fill="#94a3b8" class="font-mono" font-size="10.5">· Dynamic MAC learning &amp; frame flooding</text>
      
      <rect x="20" y="175" width="320" height="55" rx="4" fill="#050a0f" stroke="#182c3c" stroke-width="1"/>
      <text x="30" y="196" fill="#67e8f9" class="font-mono" font-size="10">&gt; python -m src.cli stp-sim</text>
      <text x="30" y="216" fill="#64748b" class="font-mono" font-size="10">Root Bridge: SW-01 (Pri: 4096) [CONVERGED]</text>
    </g>

    <!-- Card 4: Bit-Accurate Packet Serialization -->
    <g transform="translate(0, 270)">
      <rect width="360" height="250" rx="8" fill="#09131c" stroke="#3b82f6" stroke-width="1.2"/>
      <rect x="20" y="20" width="34" height="34" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="37" y="42" text-anchor="middle" fill="#93c5fd" class="font-mono" font-size="14" font-weight="900">[#4]</text>
      
      <text x="64" y="36" fill="#3b82f6" class="font-mono" font-size="11" font-weight="700">PACKET DISSECTOR</text>
      <text x="64" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">BINARY PACKET ENGINE</text>
      
      <text x="20" y="85" fill="#cbd5e1" class="font-sans" font-size="12">RFC 791 / 793 / 1071 byte serialization:</text>
      <text x="20" y="105" fill="#94a3b8" class="font-mono" font-size="10.5">· Ethernet II, 802.1Q, IPv4/IPv6, TCP, UDP</text>
      <text x="20" y="125" fill="#94a3b8" class="font-mono" font-size="10.5">· RFC 1071 16-bit One's Complement checksum</text>
      <text x="20" y="145" fill="#94a3b8" class="font-mono" font-size="10.5">· Full binary packet builder &amp; parser</text>
      
      <rect x="20" y="175" width="320" height="55" rx="4" fill="#050a0f" stroke="#182c3c" stroke-width="1"/>
      <text x="30" y="196" fill="#93c5fd" class="font-mono" font-size="10">&gt; python -m src.cli packet-craft --proto tcp</text>
      <text x="30" y="216" fill="#64748b" class="font-mono" font-size="10">Generated: 54-byte raw binary frame [OK]</text>
    </g>

    <!-- Card 5: NetDevOps & Automation -->
    <g transform="translate(380, 270)">
      <rect width="360" height="250" rx="8" fill="#09131c" stroke="#8b5cf6" stroke-width="1.2"/>
      <rect x="20" y="20" width="34" height="34" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="37" y="42" text-anchor="middle" fill="#c4b5fd" class="font-mono" font-size="14" font-weight="900">[#5]</text>
      
      <text x="64" y="36" fill="#8b5cf6" class="font-mono" font-size="11" font-weight="700">NETDEVOPS</text>
      <text x="64" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">AUTOMATION &amp; YANG DIFF</text>
      
      <text x="20" y="85" fill="#cbd5e1" class="font-sans" font-size="12">Modern programmatic infrastructure:</text>
      <text x="20" y="105" fill="#94a3b8" class="font-mono" font-size="10.5">· Syntax-aware multi-vendor config differ</text>
      <text x="20" y="125" fill="#94a3b8" class="font-mono" font-size="10.5">· YANG data model JSON/RESTCONF serializer</text>
      <text x="20" y="145" fill="#94a3b8" class="font-mono" font-size="10.5">· Network config code generation templates</text>
      
      <rect x="20" y="175" width="320" height="55" rx="4" fill="#050a0f" stroke="#182c3c" stroke-width="1"/>
      <text x="30" y="196" fill="#c4b5fd" class="font-mono" font-size="10">&gt; python -m src.automation.config_differ</text>
      <text x="30" y="216" fill="#64748b" class="font-mono" font-size="10">Detected: 4 interface delta mutations</text>
    </g>

    <!-- Card 6: Exhaustive 13-Track Documentation & PyTest -->
    <g transform="translate(760, 270)">
      <rect width="360" height="250" rx="8" fill="#09131c" stroke="#10b981" stroke-width="1.2"/>
      <rect x="20" y="20" width="34" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="37" y="42" text-anchor="middle" fill="#34d399" class="font-mono" font-size="14" font-weight="900">[#6]</text>
      
      <text x="64" y="36" fill="#10b981" class="font-mono" font-size="11" font-weight="700">RIGOROUS VERIFICATION</text>
      <text x="64" y="52" fill="#ffffff" class="font-mono" font-size="14" font-weight="800">13 TRACKS &amp; 100% PYTEST</text>
      
      <text x="20" y="85" fill="#cbd5e1" class="font-sans" font-size="12">Production-grade theoretical &amp; lab vault:</text>
      <text x="20" y="105" fill="#94a3b8" class="font-mono" font-size="10.5">· 13 deep, comprehensive technical tracks</text>
      <text x="20" y="125" fill="#94a3b8" class="font-mono" font-size="10.5">· RFC-compliant packet parsing tests</text>
      <text x="20" y="145" fill="#94a3b8" class="font-mono" font-size="10.5">· Zero external dependencies, pure Python 3.12</text>
      
      <rect x="20" y="175" width="320" height="55" rx="4" fill="#050a0f" stroke="#182c3c" stroke-width="1"/>
      <text x="30" y="196" fill="#34d399" class="font-mono" font-size="10">&gt; pytest -v</text>
      <text x="30" y="216" fill="#34d399" class="font-mono" font-size="10">==== 100% Passed (All tests green) ====</text>
    </g>
  </g>
</svg>
