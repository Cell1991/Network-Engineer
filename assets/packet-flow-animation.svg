<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090d" />
      <stop offset="50%" stop-color="#0b131c" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <pattern id="flowGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#132333" stroke-width="0.8"/>
    </pattern>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes transmitPulse {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .moving-packet-1 {
      offset-path: path("M 380 340 L 530 340 L 600 340 L 670 340 L 820 340");
      animation: transmitPulse 3s linear infinite;
    }
    .moving-packet-2 {
      offset-path: path("M 380 340 L 530 340 L 600 340 L 670 340 L 820 340");
      animation: transmitPulse 3s linear infinite;
      animation-delay: 1.5s;
    }
  </style>

  <rect width="1200" height="560" fill="url(#flowBgGrad)" rx="12" stroke="#1d3347" stroke-width="2"/>
  <rect width="1200" height="560" fill="url(#flowGrid)" rx="12"/>

  <!-- TITLE -->
  <g transform="translate(40, 42)">
    <text fill="#10b981" class="font-mono" font-size="15" font-weight="800" letter-spacing="2">[ END-TO-END TRANSMISSION DYNAMICS ]</text>
    <text y="30" fill="#ffffff" class="font-mono" font-size="26" font-weight="900">PACKET ENCAPSULATION &amp; DECAPSULATION ENGINE</text>
  </g>

  <!-- TRANSMITTING HOST A (SOURCE) -->
  <g transform="translate(40, 95)">
    <rect width="340" height="430" rx="10" fill="#09141f" stroke="#1d3347" stroke-width="1.8"/>
    <rect width="340" height="42" rx="10" fill="#0f2233"/>
    <circle cx="24" cy="21" r="6" fill="#10b981"/>
    <text x="40" y="27" fill="#ffffff" class="font-mono" font-size="14.5" font-weight="900">SOURCE NODE (10.0.1.50)</text>

    <!-- Encapsulation Stack Inside Node A -->
    <g transform="translate(20, 56)">
      <!-- L7 -->
      <g transform="translate(0, 0)">
        <rect width="300" height="52" rx="6" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
        <text x="16" y="22" fill="#fca5a5" class="font-mono" font-size="12" font-weight="800">L7 [APPLICATION PAYLOAD]</text>
        <text x="16" y="42" fill="#ffffff" class="font-mono" font-size="13" font-weight="700">GET /api/v1/telemetry HTTP/2</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 150 56 L 150 68 M 145 64 L 150 69 L 155 64" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L4 -->
      <g transform="translate(0, 72)">
        <rect width="300" height="52" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="22" fill="#34d399" class="font-mono" font-size="12" font-weight="800">L4 [TCP SEGMENT HEADER]</text>
        <text x="16" y="42" fill="#cbd5e1" class="font-mono" font-size="13">Src: 52410 | Dst: 443 | SEQ: 1001</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 150 128 L 150 140 M 145 136 L 150 141 L 155 136" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L3 -->
      <g transform="translate(0, 144)">
        <rect width="300" height="52" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="16" y="22" fill="#67e8f9" class="font-mono" font-size="12" font-weight="800">L3 [IPv4 PACKET HEADER]</text>
        <text x="16" y="42" fill="#cbd5e1" class="font-mono" font-size="13">Src: 10.0.1.50 | Dst: 10.0.2.100</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 150 200 L 150 212 M 145 208 L 150 213 L 155 208" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L2 -->
      <g transform="translate(0, 216)">
        <rect width="300" height="52" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="16" y="22" fill="#93c5fd" class="font-mono" font-size="12" font-weight="800">L2 [ETHERNET II + 802.1Q]</text>
        <text x="16" y="42" fill="#cbd5e1" class="font-mono" font-size="13">Src MAC: 00:1A.. | VLAN: 10</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 150 272 L 150 284 M 145 280 L 150 285 L 155 280" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L1 -->
      <g transform="translate(0, 288)">
        <rect width="300" height="52" rx="6" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="16" y="22" fill="#c4b5fd" class="font-mono" font-size="12" font-weight="800">L1 [OPTICAL TRANSCEIVER PHY]</text>
        <text x="16" y="42" fill="#34d399" class="font-mono" font-size="13" font-weight="800">PAM4 Laser Modulated Stream</text>
      </g>
    </g>
  </g>

  <!-- TRANSIT ROUTER -->
  <g transform="translate(410, 160)">
    <rect width="380" height="280" rx="10" fill="#081118" stroke="#1c3347" stroke-width="1.8"/>
    <text x="190" y="32" text-anchor="middle" fill="#f59e0b" class="font-mono" font-size="14" font-weight="900">TRANSIT ROUTER (HOP 1/N)</text>
    <text x="190" y="52" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="12">L2 Decap -> MAC Rewrite -> TTL Dec (-1)</text>

    <!-- Router ASIC Box -->
    <g transform="translate(100, 75)">
      <rect width="180" height="85" rx="8" fill="#0c1d2b" stroke="#10b981" stroke-width="2"/>
      <circle cx="24" cy="24" r="5" fill="#10b981"/>
      <circle cx="42" cy="24" r="5" fill="#34d399"/>
      <text x="90" y="50" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="15" font-weight="900">ROUTER ASIC</text>
      <text x="90" y="70" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="13">FIB Trie Lookup</text>
    </g>

    <!-- Fiber Path -->
    <path d="M -30 180 L 100 180 M 280 180 L 410 180" fill="none" stroke="#10b981" stroke-width="4" filter="url(#laserGlow)"/>

    <!-- Telemetry Badges -->
    <g transform="translate(30, 215)">
      <rect width="150" height="42" rx="6" fill="#09141f" stroke="#1d3347" stroke-width="1.2"/>
      <text x="14" y="27" fill="#94a3b8" class="font-mono" font-size="13">TTL: <tspan fill="#f59e0b" font-weight="800">64 → 63</tspan></text>
    </g>
    <g transform="translate(200, 215)">
      <rect width="150" height="42" rx="6" fill="#09141f" stroke="#1d3347" stroke-width="1.2"/>
      <text x="14" y="27" fill="#94a3b8" class="font-mono" font-size="13">CRC: <tspan fill="#10b981" font-weight="800">RECALCULATED</tspan></text>
    </g>
  </g>

  <!-- MOVING PACKET GRAPHICS OVER FIBER -->
  <g class="moving-packet-1">
    <rect x="-30" y="-15" width="60" height="30" rx="6" fill="#059669" stroke="#34d399" stroke-width="2" filter="url(#laserGlow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="11" font-weight="900">PACKET</text>
  </g>
  <g class="moving-packet-2">
    <rect x="-30" y="-15" width="60" height="30" rx="6" fill="#d97706" stroke="#fbbf24" stroke-width="2" filter="url(#laserGlow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="11" font-weight="900">PACKET</text>
  </g>

  <!-- RECEIVING HOST B (DESTINATION) -->
  <g transform="translate(820, 95)">
    <rect width="340" height="430" rx="10" fill="#09141f" stroke="#1d3347" stroke-width="1.8"/>
    <rect width="340" height="42" rx="10" fill="#0f2233"/>
    <circle cx="24" cy="21" r="6" fill="#38bdf8"/>
    <text x="40" y="27" fill="#ffffff" class="font-mono" font-size="14.5" font-weight="900">DEST SERVER (10.0.2.100)</text>

    <!-- Decapsulation Stack Inside Node B -->
    <g transform="translate(20, 56)">
      <!-- L1 -->
      <g transform="translate(0, 288)">
        <rect width="300" height="52" rx="6" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="16" y="22" fill="#c4b5fd" class="font-mono" font-size="12" font-weight="800">L1 [PHY DESERIALIZATION]</text>
        <text x="16" y="42" fill="#34d399" class="font-mono" font-size="13">Bits clocked into RX Buffer</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 150 284 L 150 272 M 145 276 L 150 271 L 155 276" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L2 -->
      <g transform="translate(0, 216)">
        <rect width="300" height="52" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="16" y="22" fill="#93c5fd" class="font-mono" font-size="12" font-weight="800">L2 [MAC &amp; FCS VERIFICATION]</text>
        <text x="16" y="42" fill="#cbd5e1" class="font-mono" font-size="13">FCS Valid -> Strips L2 Header</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 150 212 L 150 200 M 145 204 L 150 199 L 155 204" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L3 -->
      <g transform="translate(0, 144)">
        <rect width="300" height="52" rx="6" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.5"/>
        <text x="16" y="22" fill="#67e8f9" class="font-mono" font-size="12" font-weight="800">L3 [IP DESTINATION MATCH]</text>
        <text x="16" y="42" fill="#cbd5e1" class="font-mono" font-size="13">Dst=Self -> Protocol 6 (TCP)</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 150 140 L 150 128 M 145 132 L 150 127 L 155 132" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L4 -->
      <g transform="translate(0, 72)">
        <rect width="300" height="52" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="22" fill="#34d399" class="font-mono" font-size="12" font-weight="800">L4 [TCP SOCKET DEMUX]</text>
        <text x="16" y="42" fill="#cbd5e1" class="font-mono" font-size="13">Port 443 -> Socket Read Buffer</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 150 68 L 150 56 M 145 60 L 150 55 L 155 60" stroke="#64748b" stroke-width="2.5" fill="none"/>

      <!-- L7 -->
      <g transform="translate(0, 0)">
        <rect width="300" height="52" rx="6" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
        <text x="16" y="22" fill="#fca5a5" class="font-mono" font-size="12" font-weight="800">L7 [APPLICATION PROCESS]</text>
        <text x="16" y="42" fill="#ffffff" class="font-mono" font-size="13" font-weight="700">Web Server Worker Process</text>
      </g>
    </g>
  </g>
</svg>
