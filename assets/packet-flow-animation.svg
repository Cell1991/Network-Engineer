<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="50%" stop-color="#0d141d" />
      <stop offset="100%" stop-color="#06090d" />
    </linearGradient>

    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <radialGradient id="hostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <pattern id="flowGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#14212e" stroke-width="0.7"/>
    </pattern>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Moving light photon pulse on fiber path */
    @keyframes transmitPulse {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes bitPulse {
      0%, 100% { fill: #10b981; }
      50% { fill: #f59e0b; }
    }

    @keyframes stepActive {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .moving-packet-1 {
      offset-path: path("M 380 320 L 530 320 L 600 320 L 670 320 L 820 320");
      animation: transmitPulse 3s linear infinite;
    }
    .moving-packet-2 {
      offset-path: path("M 380 320 L 530 320 L 600 320 L 670 320 L 820 320");
      animation: transmitPulse 3s linear infinite;
      animation-delay: 1.5s;
    }

    .bit-pulse { animation: bitPulse 2s infinite ease-in-out; }
  </style>

  <rect width="1200" height="520" fill="url(#flowBgGrad)" rx="10" stroke="#1e2e3d" stroke-width="1.5"/>
  <rect width="1200" height="520" fill="url(#flowGrid)" rx="10"/>

  <!-- TITLE -->
  <g transform="translate(40, 36)">
    <text fill="#10b981" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.5">[ INTERACTIVE PROTOCOL DYNAMICS // END-TO-END TRANSMISSION ]</text>
    <text y="24" fill="#ffffff" class="font-mono" font-size="20" font-weight="900">PACKET ENCAPSULATION, SERIALIZATION &amp; DECAPSULATION ENGINE</text>
  </g>

  <!-- TRANSMITTING HOST A (SOURCE) -->
  <g transform="translate(60, 90)">
    <rect width="320" height="380" rx="8" fill="#09121b" stroke="#1d3347" stroke-width="1.5"/>
    <rect width="320" height="34" rx="8" fill="#0f1f2e"/>
    <circle cx="20" cy="17" r="4" fill="#10b981"/>
    <text x="34" y="22" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">SOURCE NODE (10.0.1.50:52410)</text>

    <!-- Encapsulation Stack Inside Node A -->
    <g transform="translate(20, 50)">
      <!-- L7: Application Data -->
      <g transform="translate(0, 0)">
        <rect width="280" height="42" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
        <text x="14" y="20" fill="#fca5a5" class="font-mono" font-size="10" font-weight="700">L7 [PAYLOAD]</text>
        <text x="14" y="34" fill="#ffffff" class="font-mono" font-size="11">GET /api/v1/telemetry HTTP/2</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 140 45 L 140 55 M 136 51 L 140 55 L 144 51" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L4: TCP Segment -->
      <g transform="translate(0, 58)">
        <rect width="280" height="42" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="20" fill="#34d399" class="font-mono" font-size="10" font-weight="700">L4 [TCP SEGMENT]</text>
        <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="10.5">Src: 52410 | Dst: 443 | SEQ: 1001</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 140 103 L 140 113 M 136 109 L 140 113 L 144 109" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L3: IPv4 Packet -->
      <g transform="translate(0, 116)">
        <rect width="280" height="42" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
        <text x="14" y="20" fill="#67e8f9" class="font-mono" font-size="10" font-weight="700">L3 [IPv4 PACKET]</text>
        <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="10.5">Src: 10.0.1.50 | Dst: 10.0.2.100 | TTL: 64</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 140 161 L 140 171 M 136 167 L 140 171 L 144 167" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L2: Ethernet Frame -->
      <g transform="translate(0, 174)">
        <rect width="280" height="42" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
        <text x="14" y="20" fill="#93c5fd" class="font-mono" font-size="10" font-weight="700">L2 [ETH II FRAME + 802.1Q]</text>
        <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="10.5">Src MAC: 00:1A.. | Dst MAC: 00:2B.. | VLAN: 10</text>
      </g>

      <!-- Down Arrow -->
      <path d="M 140 219 L 140 229 M 136 225 L 140 229 L 144 225" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L1: Physical Serialization -->
      <g transform="translate(0, 232)">
        <rect width="280" height="42" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
        <text x="14" y="20" fill="#c4b5fd" class="font-mono" font-size="10" font-weight="700">L1 [OPTICAL TRANSCEIVER / PHY]</text>
        <text x="14" y="34" fill="#34d399" class="font-mono" font-size="10.5" font-weight="700">PAM4 Laser Modulated Stream</text>
      </g>
    </g>
  </g>

  <!-- OPTICAL FIBER TRANSIT NETWORK -->
  <g transform="translate(390, 160)">
    <rect width="420" height="240" rx="8" fill="#080e14" stroke="#162736" stroke-width="1.2"/>
    <text x="210" y="28" text-anchor="middle" fill="#f59e0b" class="font-mono" font-size="11" font-weight="800">INTERMEDIATE TRANSIT ROUTER (HOP 1/N)</text>
    <text x="210" y="44" text-anchor="middle" fill="#64748b" class="font-mono" font-size="9.5">Decapsulates L2 -> Rewrites MAC -> Decrements TTL -> Re-encapsulates</text>

    <!-- Transit Router Box -->
    <g transform="translate(135, 60)">
      <rect width="150" height="70" rx="6" fill="#0c1822" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="4" fill="#10b981"/>
      <circle cx="34" cy="20" r="4" fill="#34d399"/>
      <text x="75" y="42" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">ROUTER ASIC</text>
      <text x="75" y="58" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="10">FIB Trie Lookup</text>
    </g>

    <!-- Fiber Optic Path (Single-mode Fiber 1310nm) -->
    <path id="transitFiber" d="M -10 160 L 135 160 M 285 160 L 430 160" fill="none" stroke="#10b981" stroke-width="3" filter="url(#laserGlow)"/>
    <path d="M -10 160 L 430 160" fill="none" stroke="#1e3a4a" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Telemetry Badges -->
    <g transform="translate(30, 185)">
      <rect width="160" height="34" rx="4" fill="#09131a" stroke="#1a2e3d" stroke-width="1"/>
      <text x="12" y="21" fill="#94a3b8" class="font-mono" font-size="10">TTL DECREMENT: <tspan fill="#f59e0b" font-weight="700">64 → 63</tspan></text>
    </g>
    <g transform="translate(230, 185)">
      <rect width="160" height="34" rx="4" fill="#09131a" stroke="#1a2e3d" stroke-width="1"/>
      <text x="12" y="21" fill="#94a3b8" class="font-mono" font-size="10">CHECKSUM: <tspan fill="#10b981" font-weight="700">RECALCULATED</tspan></text>
    </g>
  </g>

  <!-- MOVING PACKET GRAPHICS OVER FIBER -->
  <g class="moving-packet-1">
    <rect x="-24" y="-12" width="48" height="24" rx="4" fill="#059669" stroke="#34d399" stroke-width="1.5" filter="url(#laserGlow)"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="9" font-weight="800">PACKET</text>
  </g>
  <g class="moving-packet-2">
    <rect x="-24" y="-12" width="48" height="24" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="1.5" filter="url(#laserGlow)"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="9" font-weight="800">PACKET</text>
  </g>

  <!-- RECEIVING HOST B (DESTINATION) -->
  <g transform="translate(820, 90)">
    <rect width="320" height="380" rx="8" fill="#09121b" stroke="#1d3347" stroke-width="1.5"/>
    <rect width="320" height="34" rx="8" fill="#0f1f2e"/>
    <circle cx="20" cy="17" r="4" fill="#38bdf8"/>
    <text x="34" y="22" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">DESTINATION SERVER (10.0.2.100:443)</text>

    <!-- Decapsulation Stack Inside Node B -->
    <g transform="translate(20, 50)">
      <!-- L1: Optical Reception -->
      <g transform="translate(0, 232)">
        <rect width="280" height="42" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
        <text x="14" y="20" fill="#c4b5fd" class="font-mono" font-size="10" font-weight="700">L1 [PHY DESERIALIZATION]</text>
        <text x="14" y="34" fill="#34d399" class="font-mono" font-size="10.5">Bits clocked into RX Ring Buffer</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 140 229 L 140 219 M 136 223 L 140 219 L 144 223" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L2: Ethernet Frame Verification -->
      <g transform="translate(0, 174)">
        <rect width="280" height="42" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
        <text x="14" y="20" fill="#93c5fd" class="font-mono" font-size="10" font-weight="700">L2 [MAC &amp; FCS CHECK]</text>
        <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="10.5">FCS Valid -> Strips L2 Header</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 140 171 L 140 161 M 136 165 L 140 161 L 144 165" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L3: IPv4 Routing Check -->
      <g transform="translate(0, 116)">
        <rect width="280" height="42" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
        <text x="14" y="20" fill="#67e8f9" class="font-mono" font-size="10" font-weight="700">L3 [IP DESTINATION MATCH]</text>
        <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="10.5">Dst=Self -> Passes to Protocol 6 (TCP)</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 140 113 L 140 103 M 136 107 L 140 103 L 144 107" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L4: TCP Assembly -->
      <g transform="translate(0, 58)">
        <rect width="280" height="42" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="20" fill="#34d399" class="font-mono" font-size="10" font-weight="700">L4 [TCP SOCKET DEMUX]</text>
        <text x="14" y="34" fill="#cbd5e1" class="font-mono" font-size="10.5">Port 443 -> Socket Read Buffer</text>
      </g>

      <!-- Up Arrow -->
      <path d="M 140 55 L 140 45 M 136 49 L 140 45 L 144 49" stroke="#64748b" stroke-width="1.5" fill="none"/>

      <!-- L7: Application Delivery -->
      <g transform="translate(0, 0)">
        <rect width="280" height="42" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
        <text x="14" y="20" fill="#fca5a5" class="font-mono" font-size="10" font-weight="700">L7 [APPLICATION CONSUMER]</text>
        <text x="14" y="34" fill="#ffffff" class="font-mono" font-size="11">Web Server Worker Process</text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(60, 480)">
    <text fill="#64748b" class="font-mono" font-size="10.5">STATUS: FULL DUPLEX 100GbE ACTIVE | MTU: 9000 (JUMBO) | SERIALIZATION DELAY: 0.12µs | JITTER: &lt; 0.01ms</text>
  </g>
</svg>
