<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090d" />
      <stop offset="100%" stop-color="#0c1520" />
    </linearGradient>

    <linearGradient id="layer7Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer6Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="diagGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#132333" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgBoxGrad)" rx="12" stroke="#1d3347" stroke-width="2"/>
  <rect width="1200" height="720" fill="url(#diagGrid)" rx="12"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 42)">
    <text fill="#10b981" class="font-mono" font-size="15" font-weight="800" letter-spacing="2">[ PROTOCOL STACK ARCHITECTURAL MATRIX ]</text>
    <text y="30" fill="#ffffff" class="font-mono" font-size="26" font-weight="900">OSI 7-LAYER VS. TCP/IP 4-LAYER INTERNET STACK</text>
  </g>

  <!-- Column 1: OSI 7 LAYERS -->
  <g transform="translate(40, 95)">
    <rect width="540" height="42" rx="6" fill="#0d1e2e" stroke="#1e3e5f" stroke-width="1.5"/>
    <text x="270" y="27" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="15" font-weight="900">OSI 7-LAYER MODEL (ISO/IEC 7498-1)</text>

    <!-- Layer 7 -->
    <g transform="translate(0, 52)">
      <rect width="540" height="68" rx="8" fill="url(#layer7Grad)" stroke="#ef4444" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#ef4444" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#ef4444" class="font-mono" font-size="19" font-weight="900">L7</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">APPLICATION</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">HTTP/3, DNS, BGP-4, SSH, SNMPv3, gNMI, NTP</text>
      <text x="520" y="42" text-anchor="end" fill="#fca5a5" class="font-mono" font-size="13" font-weight="900">DATA</text>
    </g>

    <!-- Layer 6 -->
    <g transform="translate(0, 128)">
      <rect width="540" height="68" rx="8" fill="url(#layer6Grad)" stroke="#f97316" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#f97316" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#f97316" class="font-mono" font-size="19" font-weight="900">L6</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">PRESENTATION</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">TLS 1.3, JSON, YANG Data Models, Protobuf</text>
      <text x="520" y="42" text-anchor="end" fill="#fdba74" class="font-mono" font-size="13" font-weight="900">DATA</text>
    </g>

    <!-- Layer 5 -->
    <g transform="translate(0, 204)">
      <rect width="540" height="68" rx="8" fill="url(#layer5Grad)" stroke="#f59e0b" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#f59e0b" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#f59e0b" class="font-mono" font-size="19" font-weight="900">L5</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">SESSION</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">Sockets, RPC, SOCKS5, gRPC BiDi Streams</text>
      <text x="520" y="42" text-anchor="end" fill="#fcd34d" class="font-mono" font-size="13" font-weight="900">DATA</text>
    </g>

    <!-- Layer 4 -->
    <g transform="translate(0, 280)">
      <rect width="540" height="68" rx="8" fill="url(#layer4Grad)" stroke="#10b981" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#10b981" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#10b981" class="font-mono" font-size="19" font-weight="900">L4</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">TRANSPORT</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">TCP (Cubic/BBR, SACK), UDP, QUIC, SCTP</text>
      <text x="520" y="42" text-anchor="end" fill="#86efac" class="font-mono" font-size="13" font-weight="900">SEGMENT</text>
    </g>

    <!-- Layer 3 -->
    <g transform="translate(0, 356)">
      <rect width="540" height="68" rx="8" fill="url(#layer3Grad)" stroke="#06b6d4" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#06b6d4" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#06b6d4" class="font-mono" font-size="19" font-weight="900">L3</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">NETWORK</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">IPv4, IPv6, OSPFv2/3, IS-IS, ICMP, IPsec, VRF</text>
      <text x="520" y="42" text-anchor="end" fill="#67e8f9" class="font-mono" font-size="13" font-weight="900">PACKET</text>
    </g>

    <!-- Layer 2 -->
    <g transform="translate(0, 432)">
      <rect width="540" height="68" rx="8" fill="url(#layer2Grad)" stroke="#3b82f6" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#3b82f6" class="font-mono" font-size="19" font-weight="900">L2</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">DATA LINK</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">Ethernet II (802.3), 802.1Q VLAN, STP, LACP, ARP</text>
      <text x="520" y="42" text-anchor="end" fill="#93c5fd" class="font-mono" font-size="13" font-weight="900">FRAME</text>
    </g>

    <!-- Layer 1 -->
    <g transform="translate(0, 508)">
      <rect width="540" height="68" rx="8" fill="url(#layer1Grad)" stroke="#8b5cf6" stroke-width="1.8"/>
      <rect width="58" height="68" rx="8" fill="#8b5cf6" fill-opacity="0.25"/>
      <text x="29" y="42" text-anchor="middle" fill="#8b5cf6" class="font-mono" font-size="19" font-weight="900">L1</text>
      <text x="76" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">PHYSICAL</text>
      <text x="76" y="52" fill="#cbd5e1" class="font-sans" font-size="13">Single/Multi-Mode Fiber, PAM4 Laser, SFP28/QSFP-DD</text>
      <text x="520" y="42" text-anchor="end" fill="#c4b5fd" class="font-mono" font-size="13" font-weight="900">BITS</text>
    </g>
  </g>

  <!-- Column 2: TCP/IP 4-LAYER MODEL -->
  <g transform="translate(620, 95)">
    <rect width="540" height="42" rx="6" fill="#0d1e2e" stroke="#1e3e5f" stroke-width="1.5"/>
    <text x="270" y="27" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="15" font-weight="900">TCP/IP 4-LAYER INTERNET ARCHITECTURE</text>

    <!-- TCP/IP Layer 4: Application (Encompassing L7, L6, L5) -->
    <g transform="translate(0, 52)">
      <rect width="540" height="220" rx="8" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="2"/>
      <rect width="60" height="220" rx="8" fill="#ef4444" fill-opacity="0.28"/>
      <text x="30" y="118" text-anchor="middle" fill="#ef4444" class="font-mono" font-size="16" font-weight="900" transform="rotate(-90 30 118)">L4 APPL</text>
      
      <text x="80" y="34" fill="#ffffff" class="font-mono" font-size="17" font-weight="900">APPLICATION LAYER</text>
      <text x="80" y="58" fill="#cbd5e1" class="font-sans" font-size="14">Encapsulates Session, Presentation, and Application services.</text>
      
      <g transform="translate(80, 72)">
        <rect width="436" height="132" rx="6" fill="#09141f" stroke="#253b50" stroke-width="1.2"/>
        <text x="16" y="26" fill="#fca5a5" class="font-mono" font-size="12.5" font-weight="800">WEB/API: <tspan fill="#ffffff">HTTP/1.1, HTTP/2, HTTP/3 (QUIC)</tspan></text>
        <text x="16" y="50" fill="#fca5a5" class="font-mono" font-size="12.5" font-weight="800">ROUTING: <tspan fill="#ffffff">BGP-4 (Port 179), RIP (Port 520)</tspan></text>
        <text x="16" y="74" fill="#fca5a5" class="font-mono" font-size="12.5" font-weight="800">RESOLVE: <tspan fill="#ffffff">DNS (Port 53), DHCP (Ports 67/68)</tspan></text>
        <text x="16" y="98" fill="#fca5a5" class="font-mono" font-size="12.5" font-weight="800">TELEMETRY: <tspan fill="#ffffff">gNMI, RESTCONF (443), SNMPv3 (161)</tspan></text>
        <text x="16" y="120" fill="#fca5a5" class="font-mono" font-size="12.5" font-weight="800">SECURITY: <tspan fill="#ffffff">SSHv2 (Port 22), TLS 1.3 (RFC 8446)</tspan></text>
      </g>
    </g>

    <!-- TCP/IP Layer 3: Transport -->
    <g transform="translate(0, 280)">
      <rect width="540" height="68" rx="8" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-width="2"/>
      <rect width="60" height="68" rx="8" fill="#10b981" fill-opacity="0.28"/>
      <text x="30" y="42" text-anchor="middle" fill="#10b981" class="font-mono" font-size="19" font-weight="900">L3</text>
      <text x="80" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">TRANSPORT LAYER (HOST-TO-HOST)</text>
      <text x="80" y="52" fill="#cbd5e1" class="font-sans" font-size="13.5">TCP (Reliable, byte-stream, BBR/CUBIC), UDP (Datagram)</text>
    </g>

    <!-- TCP/IP Layer 2: Internet -->
    <g transform="translate(0, 356)">
      <rect width="540" height="68" rx="8" fill="#06b6d4" fill-opacity="0.16" stroke="#06b6d4" stroke-width="2"/>
      <rect width="60" height="68" rx="8" fill="#06b6d4" fill-opacity="0.28"/>
      <text x="30" y="42" text-anchor="middle" fill="#06b6d4" class="font-mono" font-size="19" font-weight="900">L2</text>
      <text x="80" y="28" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">INTERNET LAYER</text>
      <text x="80" y="52" fill="#cbd5e1" class="font-sans" font-size="13.5">IPv4 (RFC 791), IPv6 (RFC 8200), ICMPv4/v6, IGMP, IPsec</text>
    </g>

    <!-- TCP/IP Layer 1: Network Access / Link -->
    <g transform="translate(0, 432)">
      <rect width="540" height="144" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="2"/>
      <rect width="60" height="144" rx="8" fill="#3b82f6" fill-opacity="0.28"/>
      <text x="30" y="78" text-anchor="middle" fill="#3b82f6" class="font-mono" font-size="16" font-weight="900" transform="rotate(-90 30 78)">L1 LINK</text>
      <text x="80" y="32" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">NETWORK ACCESS / LINK LAYER</text>
      <text x="80" y="56" fill="#cbd5e1" class="font-sans" font-size="13.5">Handles physical hardware interfacing, framing, and optical PHYs.</text>
      <g transform="translate(80, 70)">
        <rect width="436" height="62" rx="6" fill="#09141f" stroke="#253b50" stroke-width="1.2"/>
        <text x="16" y="24" fill="#93c5fd" class="font-mono" font-size="12.5" font-weight="800">PROTOCOLS: <tspan fill="#ffffff">Ethernet II, IEEE 802.1Q, 802.11 Wi-Fi, LACP</tspan></text>
        <text x="16" y="48" fill="#93c5fd" class="font-mono" font-size="12.5" font-weight="800">HARDWARE: <tspan fill="#ffffff">ASIC PHYs, Transceivers (SFP28, QSFP-DD), DACs</tspan></text>
      </g>
    </g>
  </g>
</svg>
