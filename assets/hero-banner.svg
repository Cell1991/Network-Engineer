<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Color Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090d" />
      <stop offset="45%" stop-color="#0b131c" />
      <stop offset="100%" stop-color="#04070a" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <radialGradient id="nodeGlowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Telemetry Circuit Grid -->
    <pattern id="telemetryGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#132333" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="36" cy="0" r="1.8" fill="#10b981" fill-opacity="0.35"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow-emerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes packetFlowForward {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetFlowBackward {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 240; }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .flow-line-1 { stroke-dasharray: 12 24; animation: packetFlowForward 3s linear infinite; }
    .flow-line-2 { stroke-dasharray: 10 20; animation: packetFlowBackward 2.5s linear infinite; }
    .led-blink-1 { animation: pulseLed 1.4s ease-in-out infinite; transform-origin: center; }
    .led-blink-2 { animation: pulseLed 1.9s ease-in-out infinite; transform-origin: center; }
    .led-blink-3 { animation: pulseLed 0.9s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#telemetryGrid)" />

  <!-- Background Ambient Glow Orbs -->
  <circle cx="180" cy="140" r="220" fill="url(#nodeGlowEmerald)" />
  <circle cx="1040" cy="340" r="250" fill="url(#nodeGlowAmber)" />
  <circle cx="600" cy="240" r="220" fill="url(#nodeGlowEmerald)" opacity="0.45" />

  <!-- TOP NOC STATUS BAR (Enlarged for Mobile) -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="42" rx="8" fill="#09141f" stroke="#1d3347" stroke-width="1.8"/>
    
    <!-- Badges -->
    <circle cx="24" cy="21" r="6" fill="#10b981" class="led-blink-3" filter="url(#glow-emerald)"/>
    <text x="40" y="27" fill="#34d399" class="font-mono" font-size="14" font-weight="800" letter-spacing="1.5">SYSTEM STATE: NOMINAL</text>
    
    <text x="320" y="27" fill="#475569" class="font-mono" font-size="14">|</text>
    <text x="345" y="27" fill="#cbd5e1" class="font-mono" font-size="14">FABRIC: <tspan fill="#f59e0b" font-weight="800">400G QSFP-DD</tspan></text>
    
    <text x="610" y="27" fill="#475569" class="font-mono" font-size="14">|</text>
    <text x="635" y="27" fill="#cbd5e1" class="font-mono" font-size="14">BGP EVPN: <tspan fill="#10b981" font-weight="800">ESTABLISHED (32/32)</tspan></text>
    
    <text x="960" y="27" fill="#475569" class="font-mono" font-size="14">|</text>
    <text x="985" y="27" fill="#cbd5e1" class="font-mono" font-size="14">RTT: <tspan fill="#34d399" font-weight="800">0.24ms</tspan></text>
    
    <circle cx="1115" cy="21" r="6" fill="#f59e0b" class="led-blink-1"/>
  </g>

  <!-- BACKGROUND FIBER BUS LINES & NODES -->
  <g opacity="0.8">
    <path d="M 60 190 L 260 190 L 380 300 L 700 300 L 840 170 L 1140 170" fill="none" stroke="#162e3d" stroke-width="3"/>
    <path d="M 60 190 L 260 190 L 380 300 L 700 300 L 840 170 L 1140 170" fill="none" stroke="#10b981" stroke-width="3" class="flow-line-1" filter="url(#glow-emerald)"/>

    <path d="M 100 380 L 300 380 L 460 220 L 780 220 L 940 360 L 1120 360" fill="none" stroke="#242e1f" stroke-width="3"/>
    <path d="M 100 380 L 300 380 L 460 220 L 780 220 L 940 360 L 1120 360" fill="none" stroke="#f59e0b" stroke-width="3" class="flow-line-2" filter="url(#glow-amber)"/>

    <!-- Nodes -->
    <g transform="translate(260, 190)">
      <circle cx="0" cy="0" r="16" fill="#08121a" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#10b981" class="led-blink-1"/>
      <text x="0" y="30" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="12" font-weight="700">LEAF-01</text>
    </g>
    <g transform="translate(380, 300)">
      <circle cx="0" cy="0" r="16" fill="#08121a" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#f59e0b" class="led-blink-2"/>
      <text x="0" y="30" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="12" font-weight="700">SPINE-01</text>
    </g>
    <g transform="translate(700, 300)">
      <circle cx="0" cy="0" r="16" fill="#08121a" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#10b981" class="led-blink-3"/>
      <text x="0" y="30" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="12" font-weight="700">SPINE-02</text>
    </g>
    <g transform="translate(840, 170)">
      <circle cx="0" cy="0" r="16" fill="#08121a" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#f59e0b" class="led-blink-1"/>
      <text x="0" y="30" text-anchor="middle" fill="#94a3b8" class="font-mono" font-size="12" font-weight="700">LEAF-02</text>
    </g>
  </g>

  <!-- HERO CENTER CONTENT (High-DPI Bold Typography) -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <!-- Subtitle Badge -->
    <rect x="-290" y="-95" width="580" height="32" rx="16" fill="#091b22" stroke="#10b981" stroke-width="1.8"/>
    <text x="0" y="-74" fill="#34d399" class="font-mono" font-size="14" font-weight="800" letter-spacing="2">
      [ PROTOCOL ARCHITECTURE // SIMULATION SUITE ]
    </text>

    <!-- Main Title -->
    <text x="0" y="-14" fill="#ffffff" class="font-mono" font-size="40" font-weight="900" letter-spacing="1">
      NETWORK ENGINEER COMPENDIUM
    </text>

    <!-- Gradient Accent Line -->
    <rect x="-420" y="8" width="840" height="4" fill="url(#emeraldGrad)" rx="2"/>

    <!-- High-Impact Description -->
    <text x="0" y="44" fill="#e2e8f0" class="font-sans" font-size="18" font-weight="600" letter-spacing="0.3">
      Theoretical &amp; Operational Field Reference: Physical Optics &amp; L2/L3 Fabrics
    </text>
    <text x="0" y="70" fill="#94a3b8" class="font-sans" font-size="16" font-weight="500">
      to BGP-4 / EVPN, Segment Routing, TCP State Machines &amp; NetDevOps
    </text>
  </g>

  <!-- BOTTOM METRICS PANEL (Large, Mobile-Legible Cards) -->
  <g transform="translate(30, 385)">
    <!-- Metric 1: Tracks -->
    <g transform="translate(0, 0)">
      <rect width="270" height="72" rx="8" fill="#081119" stroke="#1d3347" stroke-width="1.8"/>
      <rect width="6" height="72" rx="3" fill="#10b981"/>
      <text x="20" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="800" letter-spacing="1">CURRICULUM TRACKS</text>
      <text x="20" y="56" fill="#ffffff" class="font-mono" font-size="22" font-weight="900">13 DEEP MODULES</text>
    </g>

    <!-- Metric 2: Simulators -->
    <g transform="translate(290, 0)">
      <rect width="270" height="72" rx="8" fill="#081119" stroke="#1d3347" stroke-width="1.8"/>
      <rect width="6" height="72" rx="3" fill="#f59e0b"/>
      <text x="20" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="800" letter-spacing="1">SIMULATION ENGINES</text>
      <text x="20" y="56" fill="#ffffff" class="font-mono" font-size="22" font-weight="900">SPF / BGP / STP</text>
    </g>

    <!-- Metric 3: Packet Crafter -->
    <g transform="translate(580, 0)">
      <rect width="270" height="72" rx="8" fill="#081119" stroke="#1d3347" stroke-width="1.8"/>
      <rect width="6" height="72" rx="3" fill="#06b6d4"/>
      <text x="20" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="800" letter-spacing="1">PACKET DISSECTORS</text>
      <text x="20" y="56" fill="#ffffff" class="font-mono" font-size="22" font-weight="900">L2 - L7 RFC PARSER</text>
    </g>

    <!-- Metric 4: Test Coverage -->
    <g transform="translate(870, 0)">
      <rect width="270" height="72" rx="8" fill="#081119" stroke="#1d3347" stroke-width="1.8"/>
      <rect width="6" height="72" rx="3" fill="#10b981"/>
      <text x="20" y="28" fill="#94a3b8" class="font-mono" font-size="12" font-weight="800" letter-spacing="1">TEST VALIDATION</text>
      <text x="20" y="56" fill="#34d399" class="font-mono" font-size="22" font-weight="900">100% PYTEST PASSED</text>
    </g>
  </g>
</svg>
