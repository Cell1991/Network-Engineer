<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <linearGradient id="bgpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090d"/>
      <stop offset="100%" stop-color="#0c1520"/>
    </linearGradient>
    <pattern id="bgpGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#132333" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="660" fill="url(#bgpGrad)" rx="12" stroke="#1d3347" stroke-width="2"/>
  <rect width="1200" height="660" fill="url(#bgpGrid)" rx="12"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text fill="#f59e0b" class="font-mono" font-size="15" font-weight="800" letter-spacing="2">[ RFC 4271 BGP-4 PATH VECTOR ALGORITHM ]</text>
    <text y="30" fill="#ffffff" class="font-mono" font-size="26" font-weight="900">BGP-4 BEST PATH SELECTION ENGINE</text>
  </g>

  <!-- Left Column: Steps 1 to 5 -->
  <g transform="translate(40, 95)">
    <rect width="540" height="535" rx="10" fill="#08121a" stroke="#1c3347" stroke-width="1.8"/>
    <text x="24" y="34" fill="#38bdf8" class="font-mono" font-size="15" font-weight="900">PATH ATTRIBUTES (STEPS 1 - 5)</text>

    <!-- Step 1: Weight -->
    <g transform="translate(20, 52)">
      <rect width="500" height="78" rx="8" fill="#0b1723" stroke="#10b981" stroke-width="1.5"/>
      <rect width="50" height="78" rx="8" fill="#10b981" fill-opacity="0.25"/>
      <text x="25" y="46" text-anchor="middle" fill="#34d399" class="font-mono" font-size="18" font-weight="900">01</text>
      <text x="66" y="32" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">WEIGHT (HIGHEST WINS)</text>
      <text x="66" y="55" fill="#94a3b8" class="font-sans" font-size="13.5">Cisco local attribute (0 - 65535). Not sent to peers.</text>
      <text x="66" y="70" fill="#38bdf8" class="font-mono" font-size="12">Default: 32768 for local, 0 for learned</text>
    </g>

    <!-- Step 2: Local Preference -->
    <g transform="translate(20, 142)">
      <rect width="500" height="78" rx="8" fill="#0b1723" stroke="#10b981" stroke-width="1.5"/>
      <rect width="50" height="78" rx="8" fill="#10b981" fill-opacity="0.25"/>
      <text x="25" y="46" text-anchor="middle" fill="#34d399" class="font-mono" font-size="18" font-weight="900">02</text>
      <text x="66" y="32" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">LOCAL PREFERENCE (HIGHEST WINS)</text>
      <text x="66" y="55" fill="#94a3b8" class="font-sans" font-size="13.5">Propagated throughout entire iBGP AS.</text>
      <text x="66" y="70" fill="#38bdf8" class="font-mono" font-size="12">Default: 100 | Influences outbound traffic</text>
    </g>

    <!-- Step 3: Locally Originated -->
    <g transform="translate(20, 232)">
      <rect width="500" height="78" rx="8" fill="#0b1723" stroke="#10b981" stroke-width="1.5"/>
      <rect width="50" height="78" rx="8" fill="#10b981" fill-opacity="0.25"/>
      <text x="25" y="46" text-anchor="middle" fill="#34d399" class="font-mono" font-size="18" font-weight="900">03</text>
      <text x="66" y="32" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">LOCALLY ORIGINATED (PREFER LOCAL)</text>
      <text x="66" y="55" fill="#94a3b8" class="font-sans" font-size="13.5">Routes injected via `network` over `redistribute`.</text>
      <text x="66" y="70" fill="#38bdf8" class="font-mono" font-size="12">Order: default &gt; network &gt; redistribute</text>
    </g>

    <!-- Step 4: AS-Path -->
    <g transform="translate(20, 322)">
      <rect width="500" height="78" rx="8" fill="#0b1723" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="50" height="78" rx="8" fill="#f59e0b" fill-opacity="0.25"/>
      <text x="25" y="46" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="18" font-weight="900">04</text>
      <text x="66" y="32" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">AS-PATH LENGTH (SHORTEST WINS)</text>
      <text x="66" y="55" fill="#94a3b8" class="font-sans" font-size="13.5">Well-known mandatory. AS-SET counts as 1.</text>
      <text x="66" y="70" fill="#fbbf24" class="font-mono" font-size="12">Used for BGP AS-Path Prepending</text>
    </g>

    <!-- Step 5: Origin Code -->
    <g transform="translate(20, 412)">
      <rect width="500" height="78" rx="8" fill="#0b1723" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="50" height="78" rx="8" fill="#f59e0b" fill-opacity="0.25"/>
      <text x="25" y="46" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="18" font-weight="900">05</text>
      <text x="66" y="32" fill="#ffffff" class="font-mono" font-size="16" font-weight="900">ORIGIN CODE (IGP &lt; EGP &lt; INCOMPLETE)</text>
      <text x="66" y="55" fill="#94a3b8" class="font-sans" font-size="13.5">Preference order: IGP (i) &gt; EGP (e) &gt; Incomplete (?).</text>
      <text x="66" y="70" fill="#fbbf24" class="font-mono" font-size="12">RFC 4271 mandatory attribute</text>
    </g>
  </g>

  <!-- Right Column: Steps 6 to 10 -->
  <g transform="translate(610, 95)">
    <rect width="550" height="535" rx="10" fill="#08121a" stroke="#1c3347" stroke-width="1.8"/>
    <text x="24" y="34" fill="#38bdf8" class="font-mono" font-size="15" font-weight="900">TIEBREAKERS (STEPS 6 - 10)</text>

    <!-- Step 6: MED -->
    <g transform="translate(20, 52)">
      <rect width="510" height="66" rx="8" fill="#0b1723" stroke="#06b6d4" stroke-width="1.5"/>
      <rect width="45" height="66" rx="8" fill="#06b6d4" fill-opacity="0.25"/>
      <text x="22" y="40" text-anchor="middle" fill="#67e8f9" class="font-mono" font-size="17" font-weight="900">06</text>
      <text x="60" y="30" fill="#ffffff" class="font-mono" font-size="15" font-weight="900">MED / METRIC (LOWEST WINS)</text>
      <text x="60" y="50" fill="#94a3b8" class="font-sans" font-size="13">Compared between routes from same neighbor AS.</text>
    </g>

    <!-- Step 7: eBGP over iBGP -->
    <g transform="translate(20, 128)">
      <rect width="510" height="66" rx="8" fill="#0b1723" stroke="#06b6d4" stroke-width="1.5"/>
      <rect width="45" height="66" rx="8" fill="#06b6d4" fill-opacity="0.25"/>
      <text x="22" y="40" text-anchor="middle" fill="#67e8f9" class="font-mono" font-size="17" font-weight="900">07</text>
      <text x="60" y="30" fill="#ffffff" class="font-mono" font-size="15" font-weight="900">PEERING TYPE (PREFER eBGP OVER iBGP)</text>
      <text x="60" y="50" fill="#94a3b8" class="font-sans" font-size="13">External eBGP route preferred over internal iBGP.</text>
    </g>

    <!-- Step 8: IGP Metric to Next-Hop -->
    <g transform="translate(20, 204)">
      <rect width="510" height="66" rx="8" fill="#0b1723" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="45" height="66" rx="8" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="22" y="40" text-anchor="middle" fill="#93c5fd" class="font-mono" font-size="17" font-weight="900">08</text>
      <text x="60" y="30" fill="#ffffff" class="font-mono" font-size="15" font-weight="900">IGP METRIC TO BGP NEXT-HOP (LOWEST WINS)</text>
      <text x="60" y="50" fill="#94a3b8" class="font-sans" font-size="13">Hot-potato routing to closest exit gateway.</text>
    </g>

    <!-- Step 9: Oldest eBGP Route -->
    <g transform="translate(20, 280)">
      <rect width="510" height="66" rx="8" fill="#0b1723" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect width="45" height="66" rx="8" fill="#8b5cf6" fill-opacity="0.25"/>
      <text x="22" y="40" text-anchor="middle" fill="#c4b5fd" class="font-mono" font-size="17" font-weight="900">09</text>
      <text x="60" y="30" fill="#ffffff" class="font-mono" font-size="15" font-weight="900">OLDEST eBGP ROUTE (MINIMIZES FLAPPING)</text>
      <text x="60" y="50" fill="#94a3b8" class="font-sans" font-size="13">Prefers longer established stable routes.</text>
    </g>

    <!-- Step 10: Router ID -->
    <g transform="translate(20, 356)">
      <rect width="510" height="66" rx="8" fill="#0b1723" stroke="#ec4899" stroke-width="1.5"/>
      <rect width="45" height="66" rx="8" fill="#ec4899" fill-opacity="0.25"/>
      <text x="22" y="40" text-anchor="middle" fill="#f472b6" class="font-mono" font-size="17" font-weight="900">10</text>
      <text x="60" y="30" fill="#ffffff" class="font-mono" font-size="15" font-weight="900">ROUTER ID (LOWEST BGP RID WINS)</text>
      <text x="60" y="50" fill="#94a3b8" class="font-sans" font-size="13">Final deterministic tiebreaker: lowest RID then IP.</text>
    </g>

    <!-- Repo Engine Badge -->
    <g transform="translate(20, 440)">
      <rect width="510" height="68" rx="8" fill="#091b22" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="28" fill="#34d399" class="font-mono" font-size="14" font-weight="900">ENGINE IN REPO: `src/routing/bgp_engine.py`</text>
      <text x="20" y="50" fill="#cbd5e1" class="font-mono" font-size="13">Validated via PyTest Decision Permutations</text>
    </g>
  </g>
</svg>
